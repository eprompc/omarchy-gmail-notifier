name: Checks
on:
  pull_request:
  push:
    branches: [main, 'fix/**']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desktop IPC dependencies for isolated integration tests
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-secret-1 dbus-daemon python3-venv gnome-keyring
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: /usr/bin/python3 -m unittest discover -s tests -v
      - run: dbus-run-session -- /usr/bin/python3 tests/dbus_integration.py
      - run: dbus-run-session -- /usr/bin/python3 tests/secret_integration.py
      - run: node --test tests/*.test.cjs
      - run: /usr/bin/python3 -m compileall -q helper
      - name: Parse QML with Qt 6
        run: |
          /usr/bin/python3 -m venv /tmp/qml-check
          /tmp/qml-check/bin/pip install PySide6-Essentials==6.12.0
          for file in *.qml; do /tmp/qml-check/bin/pyside6-qmlformat "$file" > /dev/null; done
      - name: Render localized setup guide with host shims
        run: QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software /tmp/qml-check/bin/python tests/setup_help_qml.py
